[package]
name = "blog"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"

pulldown-cmark = "0.13.0" 
pulldown-latex = "0.7.1"
autumnus = { version = "0.7.6", default-features = false, features = ["lang-rust", "lang-html", "lang-latex"] }


rustc-hash = "2.1.1"
xxhash-rust = { version = "0.8.15", features = ["xxh32"] }

walkdir = "2.5.0"
yaml-rust2 = "0.10.3"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.31"
